name: Deploy demo (Cloudflare Pages)

# Deploys the static demo after CI passes on main.
# Requires repo secrets: CLOUDFLARE_API_TOKEN (scope: Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy apps/web/out --project-name mini-loan-saas-demo --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
