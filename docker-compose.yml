# Local development stack. On AWS: Postgres -> Amazon RDS; `aws` emulator -> the real services.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_only
    ports:
      - "5433:5432" # 5432 is taken by the Homebrew Postgres on the host
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  # Local AWS emulator (moto, Apache-2.0, no account needed). One endpoint for all services:
  # S3, SQS, SNS, SES, EventBridge, KMS, SSM, Secrets Manager, DynamoDB, CloudWatch, IAM, STS.
  # State is in-memory: `npm run aws:bootstrap` recreates the resources after a restart.
  aws:
    image: motoserver/moto:5.1.22
    ports:
      - "4566:5000"
    environment:
      MOTO_PORT: "5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')\""]
      interval: 3s
      retries: 20
volumes:
  pgdata:
